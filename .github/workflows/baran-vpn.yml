name: Build Baran VPN APK

on:
  push:
    branches:
      - feature/baran-vpn-independent-app
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: baran-vpn-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Baran VPN branch
        uses: actions/checkout@v4
        with:
          ref: feature/baran-vpn-independent-app
          submodules: recursive

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
          packages: "platforms;android-37.0 build-tools;37.0.0 platform-tools"

      - name: Install NDK
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;30.0.16248370"
          echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"

      - name: Build HEV tunnel libraries
        run: NDK_DEBUG=0 bash compile-hevtun.sh

      - name: Copy HEV libraries
        run: cp -a libs V2rayNG/app/

      - name: Install libv2ray
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p V2rayNG/app/libs
          DEST="V2rayNG/app/libs/libv2ray.aar"
          if [ -f ci/deps/libv2ray.aar ]; then
            cp -f ci/deps/libv2ray.aar "$DEST"
          else
            git -C AndroidLibXrayLite fetch --tags --force || true
            TAG="$(git -C AndroidLibXrayLite describe --tags --abbrev=0 2>/dev/null || echo v26.10.31)"
            ASSET_ID="$(gh api "repos/2dust/AndroidLibXrayLite/releases/tags/${TAG}" --jq '.assets[] | select(.name=="libv2ray.aar") | .id')"
            if [ -n "$ASSET_ID" ]; then
              for attempt in 1 2 3 4 5 6 7 8; do
                if gh api -H "Accept: application/octet-stream" "repos/2dust/AndroidLibXrayLite/releases/assets/${ASSET_ID}" > "$DEST" && [ -s "$DEST" ]; then
                  break
                fi
                rm -f "$DEST"
                sleep $((attempt * 8))
              done
            fi
            if [ ! -s "$DEST" ]; then
              curl -fL --retry 10 --retry-all-errors --retry-delay 8 -o "$DEST" "https://github.com/2dust/AndroidLibXrayLite/releases/download/${TAG}/libv2ray.aar"
            fi
          fi
          python3 - <<'PY'
          import zipfile
          path = "V2rayNG/app/libs/libv2ray.aar"
          if not zipfile.is_zipfile(path):
              raise SystemExit(f"invalid aar: {path}")
          print("libv2ray.aar verified")
          PY

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prefetch Gradle distribution
        working-directory: V2rayNG
        run: |
          set -euo pipefail
          chmod 755 gradlew
          sed -i 's|https\\://services.gradle.org/distributions/|https\\://mirrors.cloud.tencent.com/gradle/|' gradle/wrapper/gradle-wrapper.properties
          ./gradlew --version

      - name: Build Baran VPN APK
        working-directory: V2rayNG
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          chmod 755 gradlew
          ./gradlew :app:assemblePlaystoreDebug --stacktrace

      - name: Verify APK identity
        run: |
          APK="$(find V2rayNG/app/build/outputs/apk/playstore/debug -name '*universal*.apk' -o -name '*.apk' | head -1)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging "$APK" | grep -E "package: name='ir.mbarani.vpn'|application-label:'Baran VPN'"
          mkdir -p release
          cp "$APK" release/BaranVPN-1.0.0-debug.apk

      - name: Upload installable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BaranVPN-1.0.0
          path: release/BaranVPN-1.0.0-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create baran-vpn-v1.0.0 release/BaranVPN-1.0.0-debug.apk \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Baran VPN 1.0.0" \
            --notes "Independent Baran VPN app. Package: ir.mbarani.vpn. This first build is debug-signed for direct installation and testing." \
            --prerelease
